<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="크로매틱">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>크로매틱 5000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 한 화면 카운터. 오늘 숫자와 +1 버튼이 중심, 아래로 오늘·주·1년 진행과 누적 그래프 */
:root {
  --bg: #eef3f1;
  --surface: #ffffff;
  --ink: #18282a;
  --muted: #5d7073;
  --line: #d3dfdc;
  --accent: #c8335e;
  --accent-soft: #f8dde5;
  --koa: #8a5a2b;
  --track: #e1eae7;
  --mid: #e47f9c;
  --ok: #2f7d5b;
  --f-display: "Gowun Batang", "Apple SD Gothic Neo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111a1b; --surface: #182425; --ink: #e5eeec; --muted: #93a7a8; --line: #2a3a3b;
  --accent: #f0688f; --accent-soft: #3d2029; --koa: #d0a271; --track: #213031; --mid: #a8466a; --ok: #6cc59a;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111a1b; --surface: #182425; --ink: #e5eeec; --muted: #93a7a8; --line: #2a3a3b;
  --accent: #f0688f; --accent-soft: #3d2029; --koa: #d0a271; --track: #213031; --mid: #a8466a; --ok: #6cc59a;
  color-scheme: dark; }

body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); }
.wrap { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 16px; }
h1, h2 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
h1 { font-size: 24px; }
h2 { font-size: 17px; }
.label { font-size: 12px; letter-spacing: .06em; color: var(--muted); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; }

/* 카운터 */
.counter { text-align: center; justify-items: center; }
.big { font-family: var(--f-mono); font-size: 84px; line-height: 1; font-variant-numeric: tabular-nums; }
.big.done { color: var(--accent); }
.plus { width: 100%; max-width: 320px; padding: 22px; font-size: 26px; font-weight: 600; background: var(--accent); border-color: var(--accent); color: #fff; border-radius: 18px; touch-action: manipulation; }
.plus:active { transform: scale(.98); }
.minus { font-size: 14px; padding: 6px 14px; color: var(--muted); }

/* 진행 막대 */
.bars { display: grid; grid-template-columns: auto 1fr auto; gap: 10px 12px; align-items: center; }
.track { height: 12px; border-radius: 6px; background: var(--track); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 6px; background: var(--mid); transition: width .25s; }
.track i.full { background: var(--accent); }
.pace { font-size: 14px; }
.pace.ahead { color: var(--ok); } .pace.behind { color: var(--accent); }

/* 이번 주 7칸 */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.week div { display: grid; gap: 2px; justify-items: center; font-size: 12px; color: var(--muted); }
.week b { width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: 10px; display: grid; place-items: center; background: var(--track); color: var(--ink); font: 500 14px var(--f-mono); }
.week b.some { background: var(--accent-soft); }
.week b.hit { background: var(--accent); color: #fff; }
.week .is-today { color: var(--ink); font-weight: 600; }

.fill { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: end; }
.pct { font-family: var(--f-mono); font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
.pct small { font-size: 20px; }
.art { width: 100%; max-width: 100%; aspect-ratio: 1; display: block; border-radius: 12px; }
.fill { grid-template-columns: 1fr; }
.fillhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.banner { font-size: 13px; padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div class="label">우쿨렐레 · 1년 목표</div>
    <h1>크로매틱 5,000회</h1>
  </header>

  <div id="banner" class="banner" hidden></div>

  <section class="card counter" aria-label="오늘 카운터">
    <div class="label">오늘</div>
    <div class="big" id="today">0</div>
    <div class="note" id="todayNote">하루 목표 15회</div>
    <button class="plus" id="plus">+1 크로매틱</button>
    <button class="minus" id="minus">잘못 눌렀어요 −1</button>
  </section>

  <section class="card" aria-labelledby="pTitle">
    <h2 id="pTitle">목표 진행</h2>
    <div class="bars" id="bars"></div>
    <div class="pace" id="pace"></div>
  </section>

  <section class="card" aria-labelledby="wTitle">
    <div class="row spread"><h2 id="wTitle">이번 주</h2><span class="note num" id="weekSum"></span></div>
    <div class="week" id="week"></div>
    <div class="note">15회를 채운 날은 진하게 표시돼요.</div>
  </section>

  <section class="card" aria-labelledby="cTitle">
    <h2 id="cTitle">5,000회 그림 채우기</h2>
    <div class="fill">
      <div class="fillhead">
        <div class="pct" id="pct">0<small>%</small></div>
        <div class="note num" id="pctSub">0 / 5,000회</div>
      </div>
      <canvas class="art" id="art" role="img" aria-label="크로매틱 횟수만큼 조각이 채워지는 그림"></canvas>
    </div>
    <div class="note">10,000조각 · 1회마다 두 조각씩 칠해져요. 희미한 조각은 오늘까지 채웠으면 하는 곳이에요.</div>
    <div class="row note">
      <span>1년 시작일</span>
      <input type="date" id="start" aria-label="1년 목표 시작일">
    </div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const GOAL = { day: 15, week: 100, year: 5000 };
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const fmt = n => n.toLocaleString("ko-KR");
  const ls = {
    get(k, f) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch { return f; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  // 상태: { start: "YYYY-MM-DD", days: { "YYYY-MM-DD": 횟수 } }
  let state = { start: ymd(new Date()), days: {} };
  let save = async () => ls.set("chromatic", state);

  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200);
  }

  // ---------- 계산 ----------
  function sums() {
    const now = new Date(), today = ymd(now);
    const mon = ymd(addDays(now, -((now.getDay() + 6) % 7)));
    const start = state.start, end = ymd(addDays(parse(start), 364));
    let d = 0, w = 0, y = 0;
    for (const [k, v] of Object.entries(state.days)) {
      if (k === today) d += v;
      if (k >= mon && k <= today) w += v;
      if (k >= start && k <= end) y += v;
    }
    return { d, w, y, today, mon };
  }

  // ---------- 그리기 ----------
  function bar(label, v, goal) {
    const full = v >= goal;
    return `<span>${label}</span><div class="track"><i class="${full ? "full" : ""}" style="width:${Math.min(100, v / goal * 100)}%"></i></div>
      <span class="num">${fmt(v)} / ${fmt(goal)}${full ? " ✓" : ""}</span>`;
  }

  function render() {
    const s = sums();
    $("today").textContent = s.d;
    $("today").classList.toggle("done", s.d >= GOAL.day);
    $("todayNote").textContent = s.d >= GOAL.day ? `하루 목표 ${GOAL.day}회 달성!` : `하루 목표까지 ${GOAL.day - s.d}회 남았어요`;
    $("bars").innerHTML = bar("오늘", s.d, GOAL.day) + bar("이번 주", s.w, GOAL.week) + bar("1년", s.y, GOAL.year);

    const elapsed = Math.min(365, Math.max(1, Math.round((parse(s.today) - parse(state.start)) / 864e5) + 1));
    const expect = Math.round(GOAL.year * elapsed / 365);
    const diff = s.y - expect;
    $("pace").className = "pace " + (diff >= 0 ? "ahead" : "behind");
    $("pace").textContent = `${elapsed}일째 · 예정 ${fmt(expect)}회보다 ${fmt(Math.abs(diff))}회 ${diff >= 0 ? "앞서 있어요" : "뒤처져 있어요"} · 남은 ${fmt(Math.max(0, GOAL.year - s.y))}회`;

    // 이번 주 (월~일)
    let h = "";
    for (let i = 0; i < 7; i++) {
      const k = ymd(addDays(parse(s.mon), i)), v = state.days[k] || 0;
      const cls = v >= GOAL.day ? "hit" : v > 0 ? "some" : "";
      h += `<div class="${k === s.today ? "is-today" : ""}"><b class="${cls}">${v || ""}</b>${"월화수목금토일"[i]}</div>`;
    }
    $("week").innerHTML = h;
    $("weekSum").textContent = `${fmt(s.w)} / ${GOAL.week}회`;

    drawAcc(s);
    $("start").value = state.start;
  }

  // ---------- 그림: 100×100 조각이 정해진 순서로 칠해짐. 무슨 그림인지는 다 채울 때까지 비밀 ----------
  const N = 100, CELLS = N * N;
  const PIX = (() => {
    const S = 400, c = document.createElement("canvas"); c.width = c.height = S;
    const g = c.getContext("2d");
    let seed = 52; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const circle = (x, y, r, col) => { g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); };
    const oval = (x, y, rx, ry, col, rot = 0) => { g.fillStyle = col; g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); g.fill(); };
    const stroke = (col, w) => { g.strokeStyle = col; g.lineWidth = w; g.lineCap = "round"; g.lineJoin = "round"; };
    const glow = (x, y, r, col) => { const q = g.createRadialGradient(x, y, 0, x, y, r); q.addColorStop(0, col); q.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = q; g.fillRect(x - r, y - r, r * 2, r * 2); };
    const H = 250;  // 수평선

    // 밤하늘
    const sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#0a1230"); sky.addColorStop(0.55, "#1c2c5e"); sky.addColorStop(1, "#3f5f92");
    g.fillStyle = sky; g.fillRect(0, 0, S, H);
    // 별
    for (let i = 0; i < 170; i++) {
      const x = rnd() * S, y = Math.pow(rnd(), 1.3) * (H - 30), r = rnd() < 0.08 ? 2 + rnd() : 0.6 + rnd() * 1.1;
      circle(x, y, r, `rgba(255,250,235,${0.45 + rnd() * 0.55})`);
    }
    [[60, 40], [165, 28], [355, 150], [120, 120]].forEach(([x, y]) => {
      glow(x, y, 14, "rgba(255,248,220,.6)"); stroke("rgba(255,250,235,.9)", 1.6);
      g.beginPath(); g.moveTo(x - 9, y); g.lineTo(x + 9, y); g.moveTo(x, y - 9); g.lineTo(x, y + 9); g.stroke();
    });
    // 달무지개 (밤에 뜨는 무지개)
    ["#ff9a9a", "#ffc98a", "#fff1a0", "#a8f0b8", "#9cd4ff", "#c3a8ff"].forEach((col, k) => {
      stroke(col, 7); g.globalAlpha = 0.22; g.beginPath(); g.arc(150, 330, 250 - k * 7, Math.PI * 1.08, Math.PI * 1.62); g.stroke();
    });
    g.globalAlpha = 1;
    // 달
    glow(300, 92, 110, "rgba(255,236,190,.35)");
    circle(300, 92, 40, "#fff3d2");
    [[288, 80, 7], [312, 100, 9], [296, 110, 4], [315, 76, 4]].forEach(([x, y, r]) => circle(x, y, r, "#f1e1b4"));
    // 하늘로 오르는 등불
    [[70, 175, 9], [96, 150, 6], [40, 130, 5], [210, 120, 7], [236, 160, 5], [350, 205, 8], [180, 70, 4], [375, 110, 5]].forEach(([x, y, r]) => {
      glow(x, y, r * 4, "rgba(255,190,90,.45)");
      g.fillStyle = "#ffcf73"; g.beginPath(); g.roundRect(x - r * 0.75, y - r, r * 1.5, r * 2, r * 0.4); g.fill();
      g.fillStyle = "#fff0bf"; g.fillRect(x - r * 0.35, y - r * 0.4, r * 0.7, r * 0.9);
    });
    // 섬 실루엣
    g.fillStyle = "#16244a"; g.beginPath(); g.moveTo(0, H);
    [[0, 200], [30, 170], [55, 150], [75, 175], [95, 160], [130, 205], [165, 232], [190, H]].forEach(([x, y]) => g.lineTo(x, y)); g.fill();
    g.fillStyle = "#1b2c55"; g.beginPath(); g.moveTo(330, H); g.quadraticCurveTo(360, 222, 400, 226); g.lineTo(400, H); g.fill();
    // 작은 섬 위 야자수
    stroke("#121d3c", 3.5);
    [[362, 228, 352, 186], [384, 228, 392, 194]].forEach(([x0, y0, x1, y1]) => {
      g.beginPath(); g.moveTo(x0, y0); g.quadraticCurveTo(x0 - 4, (y0 + y1) / 2, x1, y1); g.stroke();
      g.fillStyle = "#121d3c";
      for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2; oval(x1 + Math.cos(a) * 9, y1 + Math.sin(a) * 4, 11, 3, "#121d3c", a); }
    });
    // 바다
    const sea = g.createLinearGradient(0, H, 0, S);
    sea.addColorStop(0, "#2a4a7a"); sea.addColorStop(1, "#0a1a36");
    g.fillStyle = sea; g.fillRect(0, H, S, S - H);
    // 달빛 반사
    for (let i = 0; i < 60; i++) {
      const y = H + 4 + Math.pow(rnd(), 1.2) * 140, w = 6 + rnd() * 22 - (y - H) * 0.05;
      g.fillStyle = `rgba(255,238,195,${0.25 + rnd() * 0.5})`;
      g.fillRect(300 - w / 2 + (rnd() - 0.5) * (14 + (y - H) * 0.3), y, Math.max(3, w), 1.6);
    }
    // 고래 꼬리 + 물보라
    g.fillStyle = "#0e1d3e"; g.beginPath();
    g.moveTo(92, 262); g.quadraticCurveTo(96, 236, 104, 222);
    g.quadraticCurveTo(82, 214, 62, 196); g.quadraticCurveTo(90, 200, 108, 212);
    g.quadraticCurveTo(126, 200, 154, 196); g.quadraticCurveTo(134, 214, 112, 222);
    g.quadraticCurveTo(118, 236, 120, 262); g.closePath(); g.fill();
    stroke("rgba(160,200,255,.35)", 2); g.beginPath(); g.moveTo(66, 198); g.quadraticCurveTo(90, 204, 106, 214); g.stroke();
    for (let i = 0; i < 26; i++) { const a = Math.PI * (1.05 + rnd() * 0.9), d = 10 + rnd() * 34; circle(106 + Math.cos(a) * d * 1.3, 262 + Math.sin(a) * d * 0.7, 1 + rnd() * 2.2, "rgba(225,240,255,.85)"); }
    oval(106, 266, 34, 5, "rgba(210,230,255,.5)");
    // 반짝이는 바다(야광 플랑크톤)
    for (let i = 0; i < 70; i++) { const x = 120 + rnd() * 200, y = 300 + rnd() * 70; circle(x, y, 0.8 + rnd() * 1.6, `rgba(120,240,230,${0.35 + rnd() * 0.5})`); }
    // 카누와 우쿨렐레 치는 아이
    const cx = 220, cy = 318;
    oval(cx, cy + 12, 92, 8, "rgba(10,20,45,.6)");                                 // 그림자
    stroke("#5a3a22", 3); g.beginPath(); g.moveTo(cx - 30, cy - 2); g.lineTo(cx - 30, cy + 20); g.moveTo(cx + 30, cy - 2); g.lineTo(cx + 30, cy + 20); g.stroke();
    oval(cx + 4, cy + 22, 70, 4, "#6b4428");                                         // 아우트리거
    g.fillStyle = "#8a5430"; g.beginPath(); g.moveTo(cx - 88, cy - 6); g.quadraticCurveTo(cx, cy + 22, cx + 88, cy - 6); g.quadraticCurveTo(cx, cy + 4, cx - 88, cy - 6); g.fill();
    g.fillStyle = "#a96b3c"; g.beginPath(); g.moveTo(cx - 84, cy - 6); g.quadraticCurveTo(cx, cy + 10, cx + 84, cy - 6); g.quadraticCurveTo(cx, cy + 2, cx - 84, cy - 6); g.fill();
    // 아이 (등불빛을 받아 따뜻한 색)
    const kx = cx - 6, ky = cy - 30;
    g.fillStyle = "#ffb347"; g.beginPath(); g.roundRect(kx - 15, ky + 4, 30, 26, 9); g.fill();     // 옷
    for (let k = 0; k <= 6; k++) { const a = Math.PI * (0.15 + 0.7 * k / 6); circle(kx + Math.cos(a) * 14, ky + 4 + Math.sin(a) * 8, 3.6, ["#ff6f91", "#fff3c4", "#ffd166"][k % 3]); }  // 레이
    circle(kx, ky - 14, 17, "#3a2622");                                                    // 머리카락
    circle(kx, ky - 26, 9, "#3a2622");                                                     // 똥머리
    circle(kx, ky - 11, 14, "#f2c29d");                                                    // 얼굴
    oval(kx, ky - 22, 15, 7, "#3a2622");                                                   // 앞머리
    stroke("#3a2622", 2.4); g.beginPath(); g.arc(kx - 6, ky - 10, 3, Math.PI, 0); g.stroke(); g.beginPath(); g.arc(kx + 6, ky - 10, 3, Math.PI, 0); g.stroke();
    oval(kx - 9, ky - 5, 3.5, 2, "rgba(255,120,140,.6)"); oval(kx + 9, ky - 5, 3.5, 2, "rgba(255,120,140,.6)");
    stroke("#a0443e", 1.8); g.beginPath(); g.arc(kx, ky - 5, 3, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
    for (let k = 0; k < 5; k++) { const a = k / 5 * Math.PI * 2; circle(kx + 12 + Math.cos(a) * 3.5, ky - 24 + Math.sin(a) * 3.5, 3, "#ffffff"); } circle(kx + 12, ky - 24, 2, "#ffd166");  // 플루메리아
    // 우쿨렐레
    g.save(); g.translate(kx + 4, ky + 16); g.rotate(-0.55);
    g.fillStyle = "#6a3d1d"; g.fillRect(-2.2, -34, 4.4, 26);
    g.fillStyle = "#3d2210"; g.fillRect(-3.4, -42, 6.8, 9);
    circle(0, -4, 8, "#e0a15c"); circle(0, 6, 10, "#e0a15c"); circle(0, -2, 3, "#3d2210");
    g.restore();
    oval(kx - 13, ky + 20, 5, 4, "#f2c29d"); oval(kx + 15, ky + 4, 5, 4, "#f2c29d");   // 손
    glow(kx, ky, 60, "rgba(255,190,110,.12)");
    // 떠다니는 음표
    const note = (x, y, col) => { oval(x, y, 5, 4, col, -0.4); stroke(col, 2.4); g.beginPath(); g.moveTo(x + 4.5, y - 1); g.lineTo(x + 4.5, y - 19); g.quadraticCurveTo(x + 9, y - 15, x + 12, y - 10); g.stroke(); };
    note(250, 262, "#ffe7a8"); note(268, 238, "#ffc2d4"); note(240, 222, "#b8f0ff");
    // 앞쪽 플루메리아와 잎
    [[24, 384, -0.6], [376, 388, 0.5]].forEach(([x, y, r]) => { oval(x, y, 34, 12, "#173a33", r); oval(x + 10, y - 6, 26, 9, "#1f4a40", r + 0.5); });
    const plumeria = (x, y, r) => { for (let k = 0; k < 5; k++) { const a = k / 5 * Math.PI * 2 - 0.3; oval(x + Math.cos(a) * r * 0.6, y + Math.sin(a) * r * 0.6, r * 0.62, r * 0.36, "#fff8ec", a); } circle(x, y, r * 0.32, "#ffd36b"); };
    plumeria(30, 372, 16); plumeria(58, 390, 11); plumeria(368, 374, 15);
    // 100×100으로 줄이며 색을 고르게 섞음
    const small = document.createElement("canvas"); small.width = small.height = N;
    const sg = small.getContext("2d"); sg.imageSmoothingEnabled = true; sg.imageSmoothingQuality = "high";
    sg.drawImage(c, 0, 0, N, N);
    const d = sg.getImageData(0, 0, N, N).data, out = new Uint8ClampedArray(CELLS * 3);
    for (let i = 0; i < CELLS; i++) {
      const n = (rnd() - 0.5) * 5;   // 아주 옅은 종이 질감
      for (let k = 0; k < 3; k++) out[i * 3 + k] = d[i * 4 + k] + n;
    }
    return out;
  })();
  // 칠해지는 순서: 고정된 무작위 순서 (매번 같은 그림이 같은 순서로 드러남)
  const ORDER = (() => {
    const a = [...Array(CELLS).keys()]; let x = 20261004;
    for (let i = a.length - 1; i > 0; i--) { x = (x * 1103515245 + 12345) % 2147483648; const j = x % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
    const rank = new Array(CELLS); a.forEach((cell, k) => rank[cell] = k); return rank;
  })();
  const buf = (() => { const cv = document.createElement("canvas"); cv.width = cv.height = N; return { cv, ctx: cv.getContext("2d") }; })();
  let lastShown = -1;
  function drawAcc(s) {
    const p = Math.min(100, s.y / GOAL.year * 100);
    $("pct").innerHTML = `${p < 10 ? p.toFixed(1) : Math.floor(p)}<small>%</small>`;
    $("pctSub").textContent = `${fmt(s.y)} / ${fmt(GOAL.year)}회`;
    const done = Math.floor(Math.min(s.y, GOAL.year) / GOAL.year * CELLS);
    const elapsed = Math.min(365, Math.max(1, Math.round((parse(s.today) - parse(state.start)) / 864e5) + 1));
    const due = Math.floor(elapsed / 365 * CELLS);
    const cv = $("art"), size = cv.clientWidth || 320, dpr = window.devicePixelRatio || 1;
    const px = Math.round(size * dpr / N) * N || N * 3; if (cv.width !== px) { cv.width = cv.height = px; }
    const g = cv.getContext("2d");
    const hex = (getComputedStyle(document.documentElement).getPropertyValue("--track").trim() || "#e1eae7").replace("#", "");
    const E = [0, 2, 4].map(k => parseInt(hex.slice(k, k + 2), 16));
    // 100×100 픽셀 버퍼에 칠한 뒤 한 번에 확대해서 그림 (탭마다 빠르게)
    const img = buf.ctx.createImageData(N, N), o = img.data;
    for (let i = 0; i < CELLS; i++) {
      const r = ORDER[i], a = r < done ? 1 : r < due ? 0.28 : 0;
      for (let k = 0; k < 3; k++) o[i * 4 + k] = PIX[i * 3 + k] * a + E[k] * (1 - a);
      o[i * 4 + 3] = 255;
    }
    buf.ctx.putImageData(img, 0, 0);
    g.imageSmoothingEnabled = false;
    g.drawImage(buf.cv, 0, 0, cv.width, cv.height);
    if (lastShown >= 0 && done >= CELLS && lastShown < CELLS) toast("그림 완성! 크로매틱 5,000회 달성!");
    lastShown = done;
  }
  window.addEventListener("resize", () => render());
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => render());

  // ---------- 조작 ----------
  function change(n) {
    const k = ymd(new Date());
    const before = state.days[k] || 0;
    const v = Math.max(0, before + n);
    if (v === before) return;
    if (v) state.days[k] = v; else delete state.days[k];
    render(); queueSave();
    if (n > 0 && v === GOAL.day) toast(`오늘 ${GOAL.day}회 달성!`);
    const s = sums();
    if (n > 0 && s.w === GOAL.week) toast(`이번 주 ${GOAL.week}회 달성!`);
  }
  $("plus").onclick = () => change(1);
  $("minus").onclick = () => change(-1);
  $("start").onchange = () => { if ($("start").value) { state.start = $("start").value; render(); queueSave(); } };

  // 연타해도 한 번에 묶어서 저장
  let timer = null, saving = false, again = false;
  function queueSave() { clearTimeout(timer); timer = setTimeout(flush, 700); }
  async function flush() {
    timer = null;
    if (saving) { again = true; return; }
    saving = true;
    try { await save(); } catch { toast("저장하지 못했어요. 잠시 후 다시 눌러 보세요."); }
    saving = false;
    if (again) { again = false; flush(); }
  }

  // ---------- 저장소: 계정(db) → 쓸 수 없으면 이 기기 브라우저 ----------
  // 링크로 들어온 다른 사람도 쓸 수 있게: 계정에 저장할 권한이 없으면 각자 자기 폰에 저장
  const localSave = async () => ls.set("chromatic", state);
  const banner = msg => { const b = $("banner"); b.textContent = msg; b.hidden = !msg; };
  const LOCAL_MSG = "이 기기의 브라우저에 저장돼요. 같은 폰, 같은 브라우저로 열면 이어서 셀 수 있어요.";
  let unsub = null;
  function goLocal() {
    if (unsub) { unsub(); unsub = null; }
    save = localSave; ls.set("chromatic", state); banner(LOCAL_MSG);
  }
  state = ls.get("chromatic", state);
  render();
  (async () => {
    const [db, user] = window.claude?.use ? await Promise.all([claude.use("db"), claude.use("user")]) : [null, null];
    const uid = user ? await user.id() : null;
    const canWrite = user ? await user.can("data.write") : null;
    if (!db || !uid || canWrite === false) { goLocal(); return; }
    const ref = db.doc(`data/users/${uid}/chromatic`);
    save = async () => {
      try { await ref.set({ start: state.start, days: state.days }); }
      catch (e) {
        if (e?.code === "invalid_argument" || e?.code === "not_granted" || e?.code === "revoked") { goLocal(); return; }
        throw e;
      }
    };
    unsub = ref.onSnapshot(snap => {
      if (snap.metadata.hasPendingWrites || timer || saving) return; // 저장 대기 중인 탭이 있으면 화면 값을 유지
      if (snap.exists) { const d = snap.data(); state = { start: d.start || state.start, days: { ...(d.days || {}) } }; render(); }
      else if (Object.keys(state.days).length) flush(); // 이 기기에 있던 기록을 계정으로 옮김
    }, () => goLocal());
  })();
})();
</script>
